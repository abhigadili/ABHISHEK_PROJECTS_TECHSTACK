syntax = "proto3";
package hms.patients;

// Internal contract: patient lookups used by Appointment, Medical Records, Prescription, Laboratory and Billing.
service PatientService {
  rpc GetSummary (PatientIdRequest) returns (PatientSummary);
  rpc GetByUser (UserIdRequest) returns (PatientSummary);
}
message PatientIdRequest { int64 patient_id = 1; }
message UserIdRequest { int64 user_id = 1; }
message PatientSummary {
  int64 id = 1;
  int64 user_id = 2;      // 0 when the profile is not linked to a login
  string full_name = 3;
  string email = 4;
  string phone = 5;
  string status = 6;
}
