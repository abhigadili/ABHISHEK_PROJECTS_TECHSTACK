syntax = "proto3";
package hms.doctors;

// Internal contract: doctor information retrieval (Appointment, Prescription, Laboratory).
service DoctorService {
  rpc GetDoctor (DoctorIdRequest) returns (DoctorInfo);
}
message DoctorIdRequest { int64 doctor_id = 1; }
message DoctorInfo {
  int64 id = 1;
  int64 user_id = 2;
  string full_name = 3;
  string email = 4;
  string phone = 5;
  string specialization = 6;
  double consultation_fee = 7;
  bool active = 8;
  int64 hospital_id = 9;
  int64 department_id = 10;
}
