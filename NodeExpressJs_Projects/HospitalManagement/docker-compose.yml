# Local infrastructure only (Kafka + Redis). MySQL is the existing local server - it is NOT started here.
name: hospital-node
services:
  kafka:
    image: apache/kafka:latest
    container_name: hospital-node-kafka
    ports: ["39092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:39092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [hospital-node-kafka-data:/var/lib/kafka/data]
  redis:
    image: redis:7-alpine
    container_name: hospital-node-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["36379:6379"]
    volumes: [hospital-node-redis-data:/data]
volumes:
  hospital-node-kafka-data:
  hospital-node-redis-data:
