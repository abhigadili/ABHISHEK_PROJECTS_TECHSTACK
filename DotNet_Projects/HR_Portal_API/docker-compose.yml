    container_name: hrdn-auth
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: .env
    environment:
      <<: *appenv
      Ports__Http: "32101"
    depends_on: [redis, kafka]
    volumes: [hrdn-storage:/app/storage]
