syntax = "proto3";

option csharp_namespace = "HMS.Contracts.Patients";
package hms.patients;

// Internal, strongly typed contract used by Appointment, Medical Records, Prescription, Laboratory and Billing
// to validate patients and resolve the owner of patient data. Served by the Patient Service on its gRPC (HTTP/2) port.
service PatientGrpc {
  rpc GetSummary (PatientIdRequest) returns (PatientSummaryReply);
  rpc GetByUser (UserIdRequest) returns (PatientSummaryReply);
}

message PatientIdRequest { int64 patient_id = 1; }
message UserIdRequest { int64 user_id = 1; }

message PatientSummaryReply {
  int64 id = 1;
  int64 user_id = 2;      // 0 when the profile is not linked to a login
  string full_name = 3;
  string email = 4;
  string phone = 5;
  string status = 6;
}
