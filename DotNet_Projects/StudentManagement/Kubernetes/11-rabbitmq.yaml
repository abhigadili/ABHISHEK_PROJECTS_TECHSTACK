apiVersion: apps/v1
kind: StatefulSet
metadata: { name: rabbitmq, namespace: sms-dn }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports: [{ containerPort: 5672, name: amqp }, { containerPort: 15672, name: management }]
          env:
            - { name: RABBITMQ_DEFAULT_USER, valueFrom: { secretKeyRef: { name: sms-secrets, key: RabbitMq__UserName } } }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: sms-secrets, key: RabbitMq__Password } } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 768Mi } }
          livenessProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }, initialDelaySeconds: 40, periodSeconds: 20, timeoutSeconds: 10 }
          readinessProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "check_running"] }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: sms-dn }
spec: { selector: { app: rabbitmq }, ports: [{ name: amqp, port: 5672 }, { name: management, port: 15672 }] }
