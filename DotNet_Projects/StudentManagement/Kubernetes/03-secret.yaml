# TEMPLATE - do not commit real values. Create the real secret with:
#   kubectl -n sms-dn create secret generic sms-secrets \
#     --from-literal=MYSQL_USER=... --from-literal=MYSQL_PASSWORD=... --from-literal=Jwt__Secret=... \
#     --from-literal=Bootstrap__AdminPassword=... --from-literal=RabbitMq__UserName=... --from-literal=RabbitMq__Password=...
# (this file is intentionally NOT listed in kustomization.yaml)
apiVersion: v1
kind: Secret
metadata: { name: sms-secrets, namespace: sms-dn }
type: Opaque
stringData:
  MYSQL_USER: "<set me>"
  MYSQL_PASSWORD: "<set me>"
  Jwt__Secret: "<at least 32 characters>"
  Bootstrap__AdminPassword: "<set me>"
  RabbitMq__UserName: "guest"
  RabbitMq__Password: "<set me>"
