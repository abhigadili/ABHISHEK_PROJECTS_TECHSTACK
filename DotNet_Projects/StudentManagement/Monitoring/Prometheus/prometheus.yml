# Scrape targets: containers (service DNS names) AND host-run services (host.docker.internal) - unreachable targets are simply "down".
global: { scrape_interval: 10s }
scrape_configs:
  - job_name: containers
    metrics_path: /metrics
    static_configs:
      - targets: [api-gateway:8080, student-service:8080, course-service:8080, enrollment-service:8080, notification-service:8080]
  - job_name: host
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8080, host.docker.internal:8081, host.docker.internal:8082, host.docker.internal:8083, host.docker.internal:8084]
