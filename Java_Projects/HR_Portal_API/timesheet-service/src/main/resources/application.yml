spring:
  application:
    name: hr-timesheet-service
  config:
    import: classpath:hr-common.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hr_timesheet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  kafka:
    consumer:
      group-id: hr-timesheet-service

server:
  port: ${TIMESHEET_SERVICE_PORT:9111}

hr:
  audit:
    base-path: /api/v1/timesheets
