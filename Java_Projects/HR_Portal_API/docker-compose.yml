# HR Portal - local infrastructure and (optionally) every microservice.
#   infra only (Kafka, Kafka UI, Redis)   : docker compose up -d
#   + a containerised MySQL               : docker compose --profile mysql up -d
#   + all microservices and the gateway   : docker compose --profile mysql --profile apps up -d --build
# The default local workflow uses the EXISTING MySQL server on the host (see scripts/create-databases.sh);
# the mysql profile exists only so the whole stack can also run on a machine without MySQL.
name: hr-portal

x-app-env: &app-env
  MYSQL_HOST: ${DOCKER_MYSQL_HOST:-mysql}
  MYSQL_PORT: ${DOCKER_MYSQL_PORT:-3306}
  MYSQL_APP_USER: ${MYSQL_APP_USER}
  MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
  MYSQL_MIGRATION_USER: ${DOCKER_MYSQL_MIGRATION_USER:-root}
  MYSQL_MIGRATION_PASSWORD: ${DOCKER_MYSQL_MIGRATION_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET}
  HR_DATA_ENCRYPTION_KEY: ${HR_DATA_ENCRYPTION_KEY}
  HR_STORAGE_ROOT: /data/storage
  HR_BOOTSTRAP_ADMIN_USERNAME: ${HR_BOOTSTRAP_ADMIN_USERNAME:-}
  HR_BOOTSTRAP_ADMIN_EMAIL: ${HR_BOOTSTRAP_ADMIN_EMAIL:-}
  HR_BOOTSTRAP_ADMIN_PASSWORD: ${HR_BOOTSTRAP_ADMIN_PASSWORD:-}
  HR_EXPOSE_RESET_TOKEN: ${HR_EXPOSE_RESET_TOKEN:-false}
  AUTH_SERVICE_URL: http://auth-service:9101
  EMPLOYEE_SERVICE_URL: http://employee-service:9102
  ORGANIZATION_SERVICE_URL: http://organization-service:9103
  LEAVE_SERVICE_URL: http://leave-service:9104
  ATTENDANCE_SERVICE_URL: http://attendance-service:9105
  HOLIDAY_SERVICE_URL: http://holiday-service:9106
  PAYROLL_SERVICE_URL: http://payroll-service:9107
  TAX_SERVICE_URL: http://tax-service:9108
  PERFORMANCE_SERVICE_URL: http://performance-service:9109
  PROJECT_SERVICE_URL: http://project-service:9110
  TIMESHEET_SERVICE_URL: http://timesheet-service:9111
  EXIT_SERVICE_URL: http://exit-service:9112
  DOCUMENT_SERVICE_URL: http://document-service:9113
  NOTIFICATION_SERVICE_URL: http://notification-service:9114
  REPORTING_SERVICE_URL: http://reporting-service:9115

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: hr-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9192}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9192}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - hr-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: hr-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVER: kafka:29092
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hr-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-9190}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hr-portal-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_HOST_PORT:-9379}:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - hr-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    container_name: hr-mysql
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--max-connections=300"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_APP_USER: ${MYSQL_APP_USER}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      - "${DOCKER_MYSQL_HOST_PORT:-3317}:3306"
    volumes:
      - ./infrastructure/mysql/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./infrastructure/mysql/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
      - hr-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-gateway:
    profiles: ["apps"]
    build: ./api-gateway
    container_name: hr-api-gateway
    ports:
      - "9080:9080"
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    profiles: ["apps"]
    build: ./auth-service
    container_name: hr-auth-service
    ports:
      - "9101:9101"
    environment:
      <<: *app-env
    volumes:
      - hr-storage:/data/storage
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
        required: false

  employee-service:
