spring:
  application:
    name: hr-payroll-service
  config:
    import: classpath:hr-common.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hr_payroll_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  kafka:
    consumer:
      group-id: hr-payroll-service

server:
  port: ${PAYROLL_SERVICE_PORT:9107}

hr:
  audit:
    base-path: /api/v1/payroll
  cache:
    ttl:
      payrollConfig: 10m
