spring:
  application:
    name: hr-reporting-service
  config:
    import: classpath:hr-common.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hr_reporting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  kafka:
    consumer:
      group-id: hr-reporting-service

server:
  port: ${REPORTING_SERVICE_PORT:9115}

hr:
  audit:
    base-path: /api/v1/reports
  cache:
    ttl:
      departmentNames: 30m
