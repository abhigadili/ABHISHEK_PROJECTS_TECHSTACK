spring:
  config:
    import: classpath:hospital-common.yml
  application:
    name: hospital-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/HospitalDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8

server:
  port: ${SERVER_PORT:18104}

hospital:
  cache:
    enabled: true
    ttl:
      hospitals: 30m
      hospitalDepartments: 30m
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    staff-password: ${SEED_STAFF_PASSWORD:Staff@123}
