# Student Management System - docker compose
# MySQL is NOT part of this file: containers connect to the MySQL server already running on the host
# (MYSQL_HOST, default host.docker.internal -> host-gateway). See Documentation/24-Docker-and-Docker-Compose.md.
name: student-management

x-service-env: &service-env
  MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
  EUREKA_URL: http://eureka-server:8761/eureka
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: sms-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [sms-net]

  redis:
    image: redis:7-alpine
    container_name: sms-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sms-net]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: sms-jaeger
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4318:4318"]
    networks: [sms-net]

  # ---------------------------------------------------------------- optional: zero-config access to the HOST MySQL
  # The host MySQL listens on 127.0.0.1 only. This sidecar (NOT a MySQL server) forwards <docker-bridge-ip>:3307 -> host 127.0.0.1:3306,
  # so containers can use MYSQL_HOST=host.docker.internal MYSQL_PORT=3307 without reconfiguring MySQL.
  # Alternative for production-like setups: set bind-address=0.0.0.0 and GRANT the user from the docker subnet (see docs).
  mysql-proxy:
    profiles: ["mysql-proxy"]
    image: alpine/socat:1.8.0.0
    container_name: sms-mysql-proxy
    network_mode: host
    command: ["TCP-LISTEN:${MYSQL_PROXY_PORT:-3307},bind=${DOCKER_BRIDGE_IP:-172.17.0.1},fork,reuseaddr", "TCP:127.0.0.1:3306"]
    restart: unless-stopped

  eureka-server:
    build: { context: ., dockerfile: eureka-server/Dockerfile }
    image: sms/eureka-server:1.0.0
    container_name: sms-eureka
    ports: ["8761:8761"]
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    healthcheck: &hc-eureka
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [sms-net]

  student-service:
    build: { context: ., dockerfile: services/student-service/Dockerfile }
    image: sms/student-service:1.0.0
    container_name: sms-student
    environment: *service-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      eureka-server: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8081:8081"]
    networks: [sms-net]

  course-service:
    build: { context: ., dockerfile: services/course-service/Dockerfile }
    image: sms/course-service:1.0.0
    container_name: sms-course
    environment: *service-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      eureka-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8082:8082"]
    networks: [sms-net]

  enrollment-service:
    build: { context: ., dockerfile: services/enrollment-service/Dockerfile }
    image: sms/enrollment-service:1.0.0
    container_name: sms-enrollment
    environment: *service-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      eureka-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
      student-service: { condition: service_healthy }
      course-service: { condition: service_healthy }
    ports: ["8083:8083"]
    networks: [sms-net]

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    image: sms/notification-service:1.0.0
    container_name: sms-notification
    environment: *service-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      eureka-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8084:8084"]
    networks: [sms-net]

  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    image: sms/api-gateway:1.0.0
    container_name: sms-gateway
    environment: *service-env
    depends_on:
      eureka-server: { condition: service_healthy }
      student-service: { condition: service_healthy }
      course-service: { condition: service_healthy }
      enrollment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    ports: ["8080:8080"]
    networks: [sms-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sms-prometheus
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [sms-net]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sms-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
    networks: [sms-net]

volumes:
  kafka-data:
  redis-data:
  grafana-data:

networks:
  sms-net:
