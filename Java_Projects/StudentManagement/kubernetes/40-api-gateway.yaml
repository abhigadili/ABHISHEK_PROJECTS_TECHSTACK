apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: student-management
  labels: {app: api-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: sms/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080, name: http}
          envFrom:
            - configMapRef: {name: sms-config}
            - secretRef: {name: sms-secrets}
          env:
            - {name: SERVER_PORT, value: "8080"}
            - {name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: student-management
  labels: {app: api-gateway}
spec:
  type: NodePort
  selector: {app: api-gateway}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
