apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: student-management
  labels: {app: eureka-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app: eureka-server}
  template:
    metadata:
      labels: {app: eureka-server}
    spec:
      containers:
        - name: eureka-server
          image: sms/eureka-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8761, name: http}
          envFrom:
            - configMapRef: {name: sms-config}
          env:
            - {name: SERVER_PORT, value: "8761"}
            - {name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: student-management
  labels: {app: eureka-server}
spec:
  type: ClusterIP
  selector: {app: eureka-server}
  ports:
    - name: http
      port: 8761
      targetPort: http
