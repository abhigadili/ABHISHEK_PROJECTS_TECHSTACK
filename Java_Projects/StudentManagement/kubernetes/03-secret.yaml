# PLACEHOLDER values only - never commit real credentials. Prefer:
#   kubectl -n student-management create secret generic sms-secrets --from-literal=MYSQL_USER=... --from-literal=MYSQL_PASSWORD=... \
#       --from-literal=JWT_SECRET=$(openssl rand -hex 32) --from-literal=ADMIN_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: sms-secrets
  namespace: student-management
type: Opaque
stringData:
  MYSQL_USER: CHANGE_ME
  MYSQL_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME_TO_A_RANDOM_STRING_OF_AT_LEAST_32_CHARS
  ADMIN_PASSWORD: CHANGE_ME
