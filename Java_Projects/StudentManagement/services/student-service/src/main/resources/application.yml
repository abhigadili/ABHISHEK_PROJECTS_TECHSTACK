server:
  forward-headers-strategy: framework   # honour X-Forwarded-* from the gateway (Swagger server URL)
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: student-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/StudentDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:abhig}
    password: ${MYSQL_PASSWORD:Pass@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway; Hibernate never creates/drops
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true     # StudentDB already has tables -> baseline at 0, then apply V1+
    baseline-version: 0
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  cache:
    type: redis

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123}
  bootstrap:
    admin-username: admin
    admin-email: admin@sms.local
    admin-password: ${ADMIN_PASSWORD:Admin@123}
  cache:
    student-ttl: 10m

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health:
    probes.enabled: true
    show-details: always
    group:
      readiness.include: readinessState,db,redis
  tracing.sampling.probability: 1.0
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics.tags.application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
  level:
    com.example: INFO
