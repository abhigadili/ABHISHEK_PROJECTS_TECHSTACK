server:
  forward-headers-strategy: framework   # honour X-Forwarded-* from the gateway (Swagger server URL)
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/NotificationDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:abhig}
    password: ${MYSQL_PASSWORD:Pass@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.events
        spring.json.use.type.headers: false
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: record          # offset committed only after the listener returned successfully
      concurrency: 3
    producer:                   # used only by the dead-letter publisher
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000        # never stall a consumer thread for a minute when a DLT send cannot find metadata

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123}

notification:
  admin-email: admin@sms.local
  dispatch:
    interval-ms: 2000
    batch-size: 50
    max-attempts: 5
    base-backoff-seconds: 5
  consumer:
    retry-initial-ms: 1000
    retry-multiplier: 2.0
    retry-max-elapsed-ms: 15000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health:
    probes.enabled: true
    show-details: always
    group:
      readiness.include: readinessState,db,kafka
  tracing.sampling.probability: 1.0
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics.tags.application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
  level:
    com.example: INFO
