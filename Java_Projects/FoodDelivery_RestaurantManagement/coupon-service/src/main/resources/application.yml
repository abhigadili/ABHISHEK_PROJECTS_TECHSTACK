spring:
  application:
    name: coupon-service
  config:
    import: classpath:food-common.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/food_coupon_db${DB_SUFFIX:}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
server:
  port: 9111
food:
  security:
    public-get-paths:
      - /api/coupons/public/**
  cache:
    ttls:
      coupon: 5m
      coupon-public: 5m
