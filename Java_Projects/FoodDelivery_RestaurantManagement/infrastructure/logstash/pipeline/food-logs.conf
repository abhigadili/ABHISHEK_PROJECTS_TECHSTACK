# Spring Boot microservices -> Log4j2 JSON files -> Logstash -> Elasticsearch -> Kibana
input {
  file {
    path => "/logs/*.json.log"
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-food"
    mode => "tail"
  }
}
filter {
  # Log4j2's JsonTemplateLayout already produced structured JSON; promote/normalise fields.
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    rename => { "[error][stack_trace]" => "[error][stack]" }
    convert => { "httpStatus" => "integer" "durationMs" => "integer" }
    add_field => { "[@metadata][index_prefix]" => "food-logs" }
    remove_field => ["host", "log", "event"]
  }
  # Classify operational events so dashboards can slice them without text search
  if [logger] == "access" {
    mutate { add_field => { "category" => "api-request" } }
  } else if [message] =~ /^Kafka published|^Outbox: queued/ {
    mutate { add_field => { "category" => "kafka-producer" } }
  } else if [message] =~ /^Kafka consumed|^Duplicate event|^Dead-lettering/ {
    mutate { add_field => { "category" => "kafka-consumer" } }
  } else if [logger] == "cache" {
    mutate { add_field => { "category" => "redis-cache" } }
  } else if [logger] =~ /Payment|payment/ {
    mutate { add_field => { "category" => "payment" } }
  } else if [message] =~ /^Order .* status|status changed|^Order / {
    mutate { add_field => { "category" => "order-lifecycle" } }
  } else {
    mutate { add_field => { "category" => "application" } }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    # daily indices "food-logs-YYYY.MM.dd"; retention is enforced by the ILM policy created in setup-elasticsearch.sh
  }
}
