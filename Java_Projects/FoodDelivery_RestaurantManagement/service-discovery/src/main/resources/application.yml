spring:
  application:
    name: service-discovery
server:
  port: 9761
  shutdown: graceful
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:9761/eureka
  server:
    enable-self-preservation: false          # local dev: drop dead instances quickly
    eviction-interval-timer-in-ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info
