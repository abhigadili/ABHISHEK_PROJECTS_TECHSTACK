spring.application.name=enrollment-service
server.port=8093

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/EnrollmentDB?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:abhig}
spring.datasource.password=${DB_PASSWORD:Pass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is created by sql/03_enrollment_db.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# ---- Synchronous peer services (RestTemplate calls) ----
# Overridable via env vars so each service can be pointed at a different
# host/port without touching code, e.g. when moving from localhost to containers.
services.student.base-url=${STUDENT_SERVICE_URL:http://localhost:8091}
services.course.base-url=${COURSE_SERVICE_URL:http://localhost:8092}
services.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8094}

# MySQL here is case-sensitive for identifiers (lower_case_table_names=0).
# Disable Hibernate's default lowercasing so @Table/@Column names are used verbatim.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
