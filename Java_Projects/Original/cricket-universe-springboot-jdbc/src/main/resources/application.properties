# ===================================================================
# Cricket Universe - Spring Boot REST API (JdbcTemplate, no JPA)
# All DB secrets/urls are externalised here (never hard-coded in Java).
# Override any of these via environment variables at deploy time, e.g.:
#   export DB_USERNAME=abhig
#   export DB_PASSWORD=Pass@123
# ===================================================================

spring.application.name=cricket-universe-springboot-jdbc
server.port=8083

# ---- MySQL DataSource ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cricket_universe}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:abhig}
spring.datasource.password=${DB_PASSWORD:Pass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null

# ---- Logging is fully configured in log4j2.xml; this just points Spring at it ----
logging.config=classpath:log4j2.xml
