spring.application.name=enrollment-service
server.port=8083

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/EnrollmentDB?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:abhig}
spring.datasource.password=${DB_PASSWORD:Pass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9096}
spring.kafka.consumer.group-id=enrollment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Saga topics (cross-service, unchanged design proven in the layered-kafka and
# api-gateway-pattern sibling projects)
app.kafka.topic.enrollment-requested=enrollment.requested
app.kafka.topic.student-validation-result=student.validation.result
app.kafka.topic.course-validation-result=course.validation.result
app.kafka.topic.enrollment-confirmed=enrollment.confirmed
app.kafka.topic.enrollment-rejected=enrollment.rejected
# CQRS projection topic (internal to this service only)
app.kafka.topic.enrollment-changed=enrollment.changed

# --- Shared-secret JWT (identical value in all 4 services' application.properties) ---
app.jwt.secret=${JWT_SECRET:cqrs-student-mgmt-shared-jwt-secret-key-2026-please-rotate-me}
app.jwt.expiration-ms=3600000
