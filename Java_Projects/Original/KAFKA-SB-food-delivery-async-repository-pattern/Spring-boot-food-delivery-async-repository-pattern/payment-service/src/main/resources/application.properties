spring.application.name=payment-service
server.port=8096

# Spring Data R2DBC — non-blocking MySQL access, no JPA/Hibernate/JDBC involved.
spring.r2dbc.url=r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/PaymentDB
spring.r2dbc.username=${DB_USERNAME:abhig}
spring.r2dbc.password=${DB_PASSWORD:Pass@123}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=15

spring.jackson.default-property-inclusion=non_null

# ---- Kafka: this service's only coupling to the rest of the system ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fooddelivery.payment.event
# order-service and payment-service each define their OWN local OrderCreatedEvent
# class in different packages. Spring's JsonSerializer would otherwise embed the
# PRODUCER's fully-qualified class name in a type header and expect the consumer
# to have that exact class — impossible across independently-deployed services.
# This consumer only ever expects one event shape from this topic, so the
# simplest fix is to ignore type headers entirely and always deserialize into
# this service's own local class.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.fooddelivery.payment.event.OrderCreatedEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# No need to add type headers either — the same OrderCreatedEvent/PaymentCompletedEvent
# JSON shape is all any consumer needs; each consuming service supplies its own target type.
spring.kafka.producer.properties.spring.json.add.type.headers=false

kafka.topic.order-events=order-events
kafka.topic.payment-events=payment-events
