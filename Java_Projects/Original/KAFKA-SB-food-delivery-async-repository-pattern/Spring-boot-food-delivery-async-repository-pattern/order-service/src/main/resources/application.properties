spring.application.name=order-service
server.port=8098

# Spring Data R2DBC — non-blocking MySQL access, no JPA/Hibernate/JDBC involved.
spring.r2dbc.url=r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/OrderDB
spring.r2dbc.username=${DB_USERNAME:abhig}
spring.r2dbc.password=${DB_PASSWORD:Pass@123}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=15

spring.jackson.default-property-inclusion=non_null

# ---- Kafka: this service's only coupling to the rest of the system ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
# Base consumer properties above (bootstrap-servers/group-id/auto-offset-reset)
# are reused by config/KafkaConsumerConfig's two custom consumer factories —
# one per event shape this service consumes (PaymentCompletedEvent from
# 'payment-events', DeliveryStatusUpdatedEvent from 'delivery-events').
# Key/value deserializers are set explicitly there instead of here.

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

kafka.topic.order-events=order-events
kafka.topic.payment-events=payment-events
kafka.topic.delivery-events=delivery-events
