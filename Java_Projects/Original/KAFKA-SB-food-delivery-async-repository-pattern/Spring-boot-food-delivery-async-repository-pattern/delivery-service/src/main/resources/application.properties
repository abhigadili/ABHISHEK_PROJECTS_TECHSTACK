spring.application.name=delivery-service
server.port=8097

# Spring Data R2DBC — non-blocking MySQL access, no JPA/Hibernate/JDBC involved.
spring.r2dbc.url=r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/DeliveryDB
spring.r2dbc.username=${DB_USERNAME:abhig}
spring.r2dbc.password=${DB_PASSWORD:Pass@123}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=15

spring.jackson.default-property-inclusion=non_null

# ---- Kafka: this service's only coupling to the rest of the system ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=delivery-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fooddelivery.delivery.event
# payment-service and delivery-service each define their OWN local
# PaymentCompletedEvent class in different packages — see payment-service's
# application.properties for the full explanation. This consumer only ever
# expects one event shape from this topic, so type headers are ignored
# entirely in favour of always deserializing into this service's own class.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.fooddelivery.delivery.event.PaymentCompletedEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

kafka.topic.payment-events=payment-events
kafka.topic.delivery-events=delivery-events
