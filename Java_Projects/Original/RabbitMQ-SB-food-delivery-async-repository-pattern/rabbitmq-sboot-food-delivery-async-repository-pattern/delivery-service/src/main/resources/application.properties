spring.application.name=delivery-service
server.port=8097

# Spring Data R2DBC — non-blocking MySQL access, no JPA/Hibernate/JDBC involved.
spring.r2dbc.url=r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/DeliveryDB
spring.r2dbc.username=${DB_USERNAME:abhig}
spring.r2dbc.password=${DB_PASSWORD:Pass@123}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=15

spring.jackson.default-property-inclusion=non_null

# ---- RabbitMQ: this service's only coupling to the rest of the system ----
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# payment-events: payment-service publishes here, this service consumes it
# via its own queue bound to the exchange (order-service has its own
# separate queue on the same exchange — every message reaches every
# consumer, just like a Kafka topic with independent consumer groups).
rabbitmq.exchange.payment-events=payment-events.exchange
rabbitmq.routing-key.payment-events=payment.completed
rabbitmq.queue.payment-events=delivery-service.payment-events.queue

# delivery-events: this service publishes here, order-service consumes it.
rabbitmq.exchange.delivery-events=delivery-events.exchange
rabbitmq.routing-key.delivery-events=delivery.status-updated
