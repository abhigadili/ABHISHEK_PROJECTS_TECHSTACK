spring:
  application:
    name: hr-project-service
  config:
    import: classpath:hr-common.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hr_project_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  kafka:
    consumer:
      group-id: hr-project-service

server:
  port: ${PROJECT_SERVICE_PORT:9110}

hr:
  audit:
    base-path: /api/v1/projects
