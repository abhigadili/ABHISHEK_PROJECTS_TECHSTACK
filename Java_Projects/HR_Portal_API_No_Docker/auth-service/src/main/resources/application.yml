spring:
  application:
    name: hr-auth-service
  config:
    import: classpath:hr-common.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hr_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  kafka:
    consumer:
      group-id: hr-auth-service

server:
  port: ${AUTH_SERVICE_PORT:9101}

hr:
  audit:
    base-path: /api/v1/auth
  security:
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/forgot-password
      - /api/v1/auth/reset-password
  auth:
    max-failed-attempts: 5
    attempt-window-minutes: 15
    lock-minutes: 15
    expose-reset-token: ${HR_EXPOSE_RESET_TOKEN:false}
    bootstrap:
      username: ${HR_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${HR_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${HR_BOOTSTRAP_ADMIN_PASSWORD:}
