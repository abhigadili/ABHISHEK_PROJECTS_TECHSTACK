server:
  port: 8110

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # No path rewriting anywhere below — every backend controller already
      # exposes these exact /api/... paths, so the gateway forwards as-is.
      routes:
        - id: student-service
          uri: ${SERVICE_STUDENT_URL:http://localhost:8111}
          predicates:
            - Path=/api/students/**,/api/student-logins/**

        - id: course-service
          uri: ${SERVICE_COURSE_URL:http://localhost:8112}
          predicates:
            - Path=/api/courses/**

        - id: enrollment-service
          uri: ${SERVICE_ENROLLMENT_URL:http://localhost:8113}
          predicates:
            - Path=/api/enrollments/**,/api/enrollment-statuses/**

        - id: notification-service
          uri: ${SERVICE_NOTIFICATION_URL:http://localhost:8114}
          predicates:
            - Path=/api/notifications/**

# The one deliberate synchronous HTTP call in this whole system: the gateway
# asks student-service to verify login credentials during POST /auth/login.
# Reuses the same env var as the student-service route above, so it always
# points at the same place.
services:
  student:
    url: ${SERVICE_STUDENT_URL:http://localhost:8111}

# Shared-secret JWT — the ONLY copy of this secret in the whole system. Every
# proxied request must carry a token signed with it; the backend services
# never see or validate this secret themselves, they just trust the
# X-Authenticated-User / X-Authenticated-Role headers GatewayAuthFilter injects.
app:
  jwt:
    secret: ${JWT_SECRET:cb-retry-saga-gateway-shared-jwt-secret-key-2026-please-rotate-me}
    expiration-ms: 3600000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.studentmgmt.gateway: DEBUG
