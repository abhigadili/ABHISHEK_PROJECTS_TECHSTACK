spring.application.name=enrollment-service
server.port=8113

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/EnrollmentDB?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:abhig}
spring.datasource.password=${DB_PASSWORD:Pass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9097}
spring.kafka.consumer.group-id=enrollment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.enrollment-requested=enrollment.requested
app.kafka.topic.student-validation-result=student.validation.result
app.kafka.topic.course-validation-result=course.validation.result
app.kafka.topic.enrollment-confirmed=enrollment.confirmed
app.kafka.topic.enrollment-rejected=enrollment.rejected

# --- Cross-service URLs for the Circuit-Breaker-protected /details endpoint ---
services.student.url=${SERVICE_STUDENT_URL:http://localhost:8111}
services.course.url=${SERVICE_COURSE_URL:http://localhost:8112}

# --- RETRY pattern (Resilience4j) — see EnrollmentRequestedProducer / EnrollmentOutcomeProducer ---
resilience4j.retry.instances.kafkaPublish.max-attempts=3
resilience4j.retry.instances.kafkaPublish.wait-duration=500ms
resilience4j.retry.instances.kafkaPublish.enable-exponential-backoff=true
resilience4j.retry.instances.kafkaPublish.exponential-backoff-multiplier=2
resilience4j.retry.instances.kafkaPublish.retry-exceptions=java.lang.IllegalStateException

# --- CIRCUIT BREAKER pattern (Resilience4j) — see StudentServiceClient / CourseServiceClient ---
# sliding-window of the last 5 calls; if 50%+ (>=3) failed, trip OPEN.
# permitted-number-of-calls-in-half-open-state trial calls decide whether to
# go back to CLOSED (all succeed) or straight back to OPEN (any fails).
resilience4j.circuitbreaker.instances.studentServiceClient.sliding-window-size=5
resilience4j.circuitbreaker.instances.studentServiceClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.studentServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.studentServiceClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.studentServiceClient.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.studentServiceClient.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.courseServiceClient.sliding-window-size=5
resilience4j.circuitbreaker.instances.courseServiceClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.courseServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.courseServiceClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.courseServiceClient.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.courseServiceClient.automatic-transition-from-open-to-half-open-enabled=true

# --- Monitoring / Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

logging.level.com.studentmgmt.enrollment=DEBUG
