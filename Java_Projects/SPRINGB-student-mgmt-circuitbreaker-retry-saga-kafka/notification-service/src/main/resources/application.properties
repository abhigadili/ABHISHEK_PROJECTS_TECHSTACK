spring.application.name=notification-service
server.port=8114

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/NotificationDB?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:abhig}
spring.datasource.password=${DB_PASSWORD:Pass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9097}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.enrollment-confirmed=enrollment.confirmed
app.kafka.topic.enrollment-rejected=enrollment.rejected

# --- RETRY + CIRCUIT BREAKER combined (Resilience4j) — see NotificationDispatchService ---
# Retry: up to 3 attempts per dispatch call, fixed 300ms wait between them.
resilience4j.retry.instances.notificationGateway.max-attempts=3
resilience4j.retry.instances.notificationGateway.wait-duration=300ms

# Circuit breaker: window of the last 4 dispatch calls; if half (2+) failed
# (a "failed call" here already reflects 3 exhausted retry attempts), trip
# OPEN for 8s, then allow 2 trial calls before deciding CLOSED vs OPEN again.
resilience4j.circuitbreaker.instances.notificationGateway.sliding-window-size=4
resilience4j.circuitbreaker.instances.notificationGateway.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.notificationGateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationGateway.wait-duration-in-open-state=8s
resilience4j.circuitbreaker.instances.notificationGateway.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.notificationGateway.automatic-transition-from-open-to-half-open-enabled=true

# --- Monitoring / Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

logging.level.com.studentmgmt.notification=DEBUG
