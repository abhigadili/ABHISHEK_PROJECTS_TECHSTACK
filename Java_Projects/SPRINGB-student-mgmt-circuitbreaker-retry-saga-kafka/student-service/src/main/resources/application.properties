spring.application.name=student-service
server.port=8111

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/StudentDB?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:abhig}
spring.datasource.password=${DB_PASSWORD:Pass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9097}
spring.kafka.consumer.group-id=student-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.enrollment-requested=enrollment.requested
app.kafka.topic.student-validation-result=student.validation.result

# --- RETRY pattern (Resilience4j) — see ValidationResultProducer ---
# 3 attempts total (1 initial + 2 retries), waiting 500ms then 1000ms between
# attempts (exponential backoff, multiplier 2). Retries ONLY on the
# IllegalStateException ValidationResultProducer wraps Kafka send failures in.
resilience4j.retry.instances.kafkaPublish.max-attempts=3
resilience4j.retry.instances.kafkaPublish.wait-duration=500ms
resilience4j.retry.instances.kafkaPublish.enable-exponential-backoff=true
resilience4j.retry.instances.kafkaPublish.exponential-backoff-multiplier=2
resilience4j.retry.instances.kafkaPublish.retry-exceptions=java.lang.IllegalStateException

# --- Monitoring / Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus,retries,retryevents
management.endpoint.health.show-details=always
management.health.ratelimiters.enabled=true

logging.level.com.studentmgmt.student=DEBUG
