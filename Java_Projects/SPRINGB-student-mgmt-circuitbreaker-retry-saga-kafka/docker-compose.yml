services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: cb-retry-saga-student-mgmt-kafka
    ports:
      # Host port 9097 — 9092 is used by an unrelated container on this
      # machine, 9094 by the sibling SPRINGB-student-mgmt-async-layered-kafka
      # project, 9095 by SPRINGB-SMgmt-async-api-gateway-pattern-kafka, and
      # 9096 by SPRINGB-student-mgmt-async-CQRS-pattern-kafka.
      - "9097:9097"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9097
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "cb-retry-saga-student-mgmt-kraft-cluster"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9097 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
